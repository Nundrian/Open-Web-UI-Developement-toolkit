name: Python security and regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependency
        run: python -m pip install "pydantic>=2,<3"
      - name: Check Python syntax
        run: python -m compileall -q development_toolkit.py toolkit_tests
      - name: Run offline and redirect security regressions
        run: python -m unittest discover -s toolkit_tests -v
